spring.application.name=allcraft0r_discord

# ── Discord ────────────────────────────────────────────────────────────────────
discord.bot.token=${DISCORD_BOT_TOKEN}
discord.guild.id=${DISCORD_GUILD_ID}
discord.admin_channel.id=${DISCORD_ADMIN_CHANNEL_ID}
discord.redstone_emoji.id=${DISCORD_REDSTONE_EMOJI_ID}

# ── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Flyway ───────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate

# ── Server & Shutdown ─────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.shutdown=graceful

# ── Actuator ───────────────────────────────────────────────────────────────────
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.net.dv8tion=WARN
logging.level.fr.may_baptiste=DEBUG

