# ── Database (H2 in-memory for integration tests) ──────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── Flyway ─────────────────────────────────────────────────────────────────────
spring.flyway.locations=classpath:db/migration

# ── Discord (stub values — DiscordConfig bean is excluded in tests) ─────────────
discord.bot.token=dummy
discord.guild.id=0
discord.admin_channel.id=0
discord.redstone_emoji.id=0

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.fr.may_baptiste=DEBUG
