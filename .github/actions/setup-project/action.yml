name: 'Setup Java & Gradle'
description: 'Configures JDK 25 (Temurin) and Gradle build caching'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
